<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>NEXUS</title>
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-tertiary: #1a1a28;
    --bg-input: #16161f;
    --accent: #6c5ce7;
    --accent-dim: #4a3db5;
    --accent-glow: rgba(108,92,231,0.25);
    --text-primary: #e8e6f0;
    --text-secondary: #8b89a0;
    --text-dim: #5a5872;
    --success: #00d2a0;
    --error: #ff4757;
    --warning: #ffa502;
    --border: rgba(108,92,231,0.15);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    --transition: 0.2s ease;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    font-size: 16px;
    line-height: 1.5;
  }

  /* ── Layout ─────────────────────────────── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 100vw;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    backdrop-filter: blur(20px);
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #fff;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .header-title {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.5px;
  }

  .header-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  .status-dot.thinking { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
  .status-dot.error { background: var(--error); box-shadow: 0 0 8px var(--error); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.9); }
  }

  .header-actions {
    display: flex; gap: 8px;
  }

  .icon-btn {
    width: 36px; height: 36px;
    border: none; border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
  }

  .icon-btn:active { transform: scale(0.92); background: var(--accent-dim); color: #fff; }

  /* ── Chat Area ──────────────────────────── */
  .chat {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .chat::-webkit-scrollbar { width: 3px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

  /* ── Messages ───────────────────────────── */
  .msg {
    margin-bottom: 16px;
    max-width: 92%;
    animation: msgIn 0.3s ease-out;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    margin-left: auto;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .msg.user .msg-bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant .msg-bubble {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.system .msg-bubble {
    background: rgba(108,92,231,0.1);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
    padding: 8px 12px;
  }

  .msg-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    padding: 0 4px;
  }

  .msg.user .msg-label { text-align: right; }

  /* ── Tool Calls ─────────────────────────── */
  .tool-call {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    margin: 6px 0;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-secondary);
  }

  .tool-icon {
    width: 22px; height: 22px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }

  .tool-icon.success { background: rgba(0,210,160,0.15); color: var(--success); }
  .tool-icon.error { background: rgba(255,71,87,0.15); color: var(--error); }
  .tool-icon.running { background: rgba(255,165,2,0.15); color: var(--warning); }

  .tool-name {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-weight: 600;
    color: var(--accent);
  }

  .tool-time {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── Code Blocks ────────────────────────── */
  .msg-bubble pre {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.4;
  }

  .msg-bubble code {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
  }

  .msg-bubble p { margin: 6px 0; }
  .msg-bubble strong { color: var(--accent); }

  /* ── Typing Indicator ───────────────────── */
  .typing {
    display: flex; gap: 4px;
    padding: 12px 16px;
    align-items: center;
  }

  .typing-dot {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typingBounce 1.4s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Input Area ─────────────────────────── */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(20px);
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }

  #msgInput {
    width: 100%;
    min-height: 44px;
    max-height: 120px;
    padding: 10px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 22px;
    color: var(--text-primary);
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color var(--transition);
    line-height: 1.4;
  }

  #msgInput::placeholder { color: var(--text-dim); }
  #msgInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

  .send-btn {
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.4; box-shadow: none; }

  /* ── Settings Panel ─────────────────────── */
  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .panel-overlay.open { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-height: 70vh;
    background: var(--bg-secondary);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    padding: 20px;
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
    overflow-y: auto;
  }

  .panel-overlay.open + .panel,
  .panel.open { transform: translateY(0); }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--text-dim);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .panel-title {
    font-size: 18px; font-weight: 700;
    margin-bottom: 16px;
  }

  .setting-group {
    margin-bottom: 16px;
  }

  .setting-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .setting-input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 14px;
    font-family: 'SF Mono', monospace;
    outline: none;
  }

  .setting-input:focus { border-color: var(--accent); }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── Welcome Screen ─────────────────────── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  .welcome-logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 24px; color: #fff;
    box-shadow: 0 0 32px var(--accent-glow);
    margin-bottom: 20px;
  }

  .welcome h2 {
    font-size: 22px; font-weight: 700;
    margin-bottom: 8px;
  }

  .welcome p {
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 300px;
    margin-bottom: 24px;
  }

  .quick-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 320px;
  }

  .quick-btn {
    padding: 12px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    transition: var(--transition);
  }

  .quick-btn:active { background: var(--accent-dim); border-color: var(--accent); }
  .quick-btn .label { color: var(--accent); font-weight: 600; font-size: 13px; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">N</div>
      <div>
        <div class="header-title">NEXUS</div>
        <div class="header-subtitle" id="modelLabel">Mistral Small · NVIDIA</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="status-dot" id="statusDot"></div>
      <button class="icon-btn" onclick="togglePanel()" aria-label="Settings">⚙</button>
    </div>
  </header>

  <!-- Chat -->
  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">N</div>
      <h2>NEXUS Agent</h2>
      <p>Autonomous AI agent powered by Mistral Small. Give me a task and I'll execute it.</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('List all files in the current directory and describe the project structure')">
          <div class="label">📁 Explore</div>
          Analyze current directory structure
        </button>
        <button class="quick-btn" onclick="sendQuick('Show me system information: OS, memory, CPU, and running processes')">
          <div class="label">🖥️ System</div>
          Check system resources
        </button>
        <button class="quick-btn" onclick="sendQuick('Search the web for the latest news about AI agents and summarize the top 3 findings')">
          <div class="label">🔍 Research</div>
          Web search & summarize
        </button>
        <button class="quick-btn" onclick="sendQuick('/help')">
          <div class="label">❓ Help</div>
          Show available commands
        </button>
      </div>
    </div>
  </main>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <div class="input-wrapper">
        <textarea id="msgInput" placeholder="Enter a task..." rows="1" 
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
        ➤
      </button>
    </div>
  </div>
</div>

<!-- Settings Panel -->
<div class="panel-overlay" id="panelOverlay" onclick="togglePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-title">Settings & Stats</div>
  
  <div class="setting-group">
    <div class="setting-label">API Key (NVIDIA)</div>
    <input type="password" class="setting-input" id="apiKeyInput" 
      placeholder="nvapi-..." onchange="saveApiKey(this.value)">
  </div>

  <div class="setting-group">
    <div class="setting-label">Server URL</div>
    <input type="text" class="setting-input" id="serverUrl" 
      value="http://localhost:8080" placeholder="http://localhost:8080">
  </div>

  <div class="stat-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-value" id="statState">—</div>
      <div class="stat-label">State</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statFacts">0</div>
      <div class="stat-label">Facts</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statMsgs">0</div>
      <div class="stat-label">Messages</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statReqs">0</div>
      <div class="stat-label">API Calls</div>
    </div>
  </div>
</div>

<script>
  // ─── State ──────────────────────────────────
  const state = {
    messages: [],
    isLoading: false,
    serverUrl: localStorage.getItem('nexus_server') || 'http://localhost:8080',
    apiKey: localStorage.getItem('nexus_apikey') || ''
  };

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const welcomeEl = document.getElementById('welcome');

  // ─── Init ───────────────────────────────────
  document.getElementById('serverUrl').value = state.serverUrl;
  if (state.apiKey) document.getElementById('apiKeyInput').value = '••••••••';

  // ─── Send Message ───────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || state.isLoading) return;

    // Hide welcome
    if (welcomeEl) welcomeEl.style.display = 'none';

    // Add user message
    addMessage('user', text);
    inputEl.value = '';
    autoResize(inputEl);

    // Set loading state
    setLoading(true);

    try {
      const response = await fetch(`${state.serverUrl}/api/chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(state.apiKey ? { 'X-API-Key': state.apiKey } : {})
        },
        body: JSON.stringify({ message: text })
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      const data = await response.text();
      addMessage('assistant', data);
    } catch (error) {
      addMessage('system', `Connection error: ${error.message}. Make sure the server is running.`);
      statusDot.className = 'status-dot error';
    } finally {
      setLoading(false);
    }
  }

  function sendQuick(text) {
    inputEl.value = text;
    sendMessage();
  }

  // ─── Add Message to Chat ────────────────────
  function addMessage(role, content) {
    state.messages.push({ role, content, time: Date.now() });

    const msgEl = document.createElement('div');
    msgEl.className = `msg ${role}`;

    // Label
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : role === 'assistant' ? 'NEXUS' : 'System';
    msgEl.appendChild(label);

    // Bubble
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    // Parse content for basic formatting
    bubble.innerHTML = formatContent(content);
    msgEl.appendChild(bubble);

    chatEl.appendChild(msgEl);
    scrollToBottom();

    // Update stats
    document.getElementById('statMsgs').textContent = state.messages.length;
  }

  // ─── Format Content ─────────────────────────
  function formatContent(text) {
    // Escape HTML
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Code blocks
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code.trim()}</code></pre>`
    );

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    // Line breaks
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  // ─── Loading State ──────────────────────────
  function setLoading(loading) {
    state.isLoading = loading;
    sendBtn.disabled = loading;

    if (loading) {
      statusDot.className = 'status-dot thinking';

      // Add typing indicator
      const typingEl = document.createElement('div');
      typingEl.className = 'msg assistant';
      typingEl.id = 'typingIndicator';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble typing';
      bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

      typingEl.appendChild(bubble);
      chatEl.appendChild(typingEl);
      scrollToBottom();
    } else {
      statusDot.className = 'status-dot';

      const typingEl = document.getElementById('typingIndicator');
      if (typingEl) typingEl.remove();
    }
  }

  // ─── Utility Functions ──────────────────────
  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatEl.scrollTop = chatEl.scrollHeight;
    });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function togglePanel() {
    const overlay = document.getElementById('panelOverlay');
    const panel = document.getElementById('panel');
    const isOpen = overlay.classList.contains('open');

    if (isOpen) {
      overlay.classList.remove('open');
      panel.classList.remove('open');
    } else {
      overlay.classList.add('open');
      panel.classList.add('open');
      fetchStats();
    }
  }

  async function fetchStats() {
    try {
      const res = await fetch(`${state.serverUrl}/api/status`);
      const stats = await res.json();
      document.getElementById('statState').textContent = stats.state || '—';
      document.getElementById('statFacts').textContent = stats.memory?.totalFacts || 0;
      document.getElementById('statReqs').textContent = stats.apiRequests || 0;
    } catch {
      document.getElementById('statState').textContent = 'offline';
    }
  }

  async function saveApiKey(key) {
    if (!key || key.length < 10) return;

    // Try to save via server (which validates it)
    try {
      const res = await fetch(`${state.serverUrl}/api/apikey`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apikey: key })
      });
      const data = await res.json();
      if (data.success) {
        state.apiKey = key;
        localStorage.setItem('nexus_apikey', key);
        addMessage('system', 'API key validated and saved. Agent is ready.');
        statusDot.className = 'status-dot';
        // Reload page to refresh connection
        setTimeout(() => location.reload(), 500);
      } else {
        addMessage('system', `API key invalid: ${data.error}`);
      }
    } catch (error) {
      // Server not running — save locally and hope
      state.apiKey = key;
      localStorage.setItem('nexus_apikey', key);
      addMessage('system', 'Key saved locally. Will be used on next connection.');
    }
  }

  // Save server URL on change
  document.getElementById('serverUrl').addEventListener('change', (e) => {
    state.serverUrl = e.target.value;
    localStorage.setItem('nexus_server', e.target.value);
  });

  // Focus input on load
  inputEl.focus();
</script>

</body>
</html>
