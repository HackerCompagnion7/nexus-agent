<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<meta name="application-name" content="JARVIS">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="/manifest.json">
<title>JARVIS</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #0e0e16;
  --bg3: #161622;
  --accent: #6c5ce7;
  --accent2: #a855f7;
  --accent-dim: #4a3db5;
  --glow: rgba(108,92,231,0.3);
  --text: #e8e6f0;
  --text2: #8b89a0;
  --text3: #5a5872;
  --ok: #00d2a0;
  --err: #ff4757;
  --warn: #ffa502;
  --cyan: #00b4d8;
  --border: rgba(108,92,231,0.15);
  --r: 16px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  overflow:hidden;font-size:16px;line-height:1.5;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:100vw;overflow:hidden}

/* ── HEADER ─────────────────────────────── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-shrink:0;
  backdrop-filter:blur(20px);z-index:10;
}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#fff;
  box-shadow:0 0 14px var(--glow);
}
.hdr-t{font-weight:700;font-size:18px;letter-spacing:1px}
.hdr-s{font-size:10px;color:var(--text3);letter-spacing:.3px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 8px var(--ok);
  animation:pulse 2s ease-in-out infinite;
}
.dot.think{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.err{background:var(--err);box-shadow:0 0 8px var(--err)}
.dot.listen{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:listenPulse 1s ease-in-out infinite}
.dot.speak{background:var(--accent2);box-shadow:0 0 10px var(--accent2);animation:listenPulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.9)}}
@keyframes listenPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}

.ib{
  width:40px;height:40px;border:none;border-radius:12px;
  background:var(--bg3);color:var(--text2);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.15s ease;
}
.ib:active{transform:scale(.9);background:var(--accent-dim);color:#fff}

/* ── MAIN VOICE AREA ────────────────────── */
.voice-main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;position:relative;overflow:hidden;
}

/* ── ORB ────────────────────────────────── */
.orb-container{position:relative;margin-bottom:24px}
.orb{
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--accent2),var(--accent),#3d2d8f);
  box-shadow:0 0 40px var(--glow),0 0 80px rgba(108,92,231,.15),
    inset 0 0 30px rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .2s,box-shadow .3s;
  position:relative;z-index:2;
}
.orb:active{transform:scale(.95)}
.orb.listening{
  animation:orbListen 1.5s ease-in-out infinite;
  box-shadow:0 0 50px rgba(0,180,216,.5),0 0 100px rgba(0,180,216,.2),
    inset 0 0 30px rgba(0,180,216,.1);
  background:radial-gradient(circle at 35% 35%,#00b4d8,#0077b6,#004e7c);
}
.orb.speaking{
  animation:orbSpeak 1s ease-in-out infinite;
  box-shadow:0 0 50px rgba(168,85,247,.5),0 0 100px rgba(168,85,247,.2),
    inset 0 0 30px rgba(168,85,247,.1);
  background:radial-gradient(circle at 35% 35%,var(--accent2),#9333ea,#6b21a8);
}
.orb.thinking{
  animation:orbThink 2s linear infinite;
  box-shadow:0 0 50px rgba(255,165,2,.4),0 0 100px rgba(255,165,2,.15);
  background:radial-gradient(circle at 35% 35%,var(--warn),#d97706,#92400e);
}
@keyframes orbListen{
  0%,100%{transform:scale(1);box-shadow:0 0 50px rgba(0,180,216,.5)}
  50%{transform:scale(1.06);box-shadow:0 0 70px rgba(0,180,216,.7)}
}
@keyframes orbSpeak{
  0%,100%{transform:scale(1);box-shadow:0 0 50px rgba(168,85,247,.5)}
  50%{transform:scale(1.04);box-shadow:0 0 65px rgba(168,85,247,.7)}
}
@keyframes orbThink{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

/* Rings around orb */
.orb-ring{
  position:absolute;inset:-12px;border-radius:50%;
  border:2px solid rgba(0,180,216,.25);
  animation:ringExpand 2s ease-out infinite;
  opacity:0;z-index:1;pointer-events:none;
}
.orb-ring:nth-child(2){animation-delay:.7s}
.orb-ring:nth-child(3){animation-delay:1.4s}
.orb.listening~.orb-ring{opacity:1;border-color:rgba(0,180,216,.3)}
.orb.speaking~.orb-ring{opacity:1;border-color:rgba(168,85,247,.3)}
@keyframes ringExpand{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}

.orb-icon{font-size:48px;color:#fff;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,255,255,.3))}
.orb.listening .orb-icon{animation:iconPulse 1s ease-in-out infinite}
@keyframes iconPulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ── STATUS TEXT ─────────────────────────── */
.status{
  text-align:center;font-size:15px;color:var(--text2);
  min-height:24px;margin-bottom:6px;letter-spacing:.3px;
  transition:color .3s;
}
.status.active{color:var(--cyan)}
.status.speaking-text{color:var(--accent2)}
.status.thinking-text{color:var(--warn)}

/* ── TRANSCRIPT ──────────────────────────── */
.transcript{
  text-align:center;font-size:20px;color:var(--text);
  min-height:32px;max-width:300px;
  font-weight:600;margin-bottom:16px;
  line-height:1.4;
}
.transcript.interim{color:var(--text2);font-weight:400;font-size:17px}

/* ── RESPONSE AREA ──────────────────────── */
.response{
  text-align:center;font-size:14px;color:var(--text2);
  max-width:320px;line-height:1.6;
  max-height:180px;overflow-y:auto;
  padding:0 8px;
}
.response::-webkit-scrollbar{width:2px}
.response::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:2px}
.response strong{color:var(--accent)}

/* ── BOTTOM BAR ──────────────────────────── */
.bottom-bar{
  flex-shrink:0;padding:12px 20px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:16px;
}
.bbtn{
  padding:10px 20px;border:none;border-radius:24px;
  background:var(--bg3);color:var(--text2);font-size:14px;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:.15s;font-weight:500;
}
.bbtn:active{transform:scale(.95)}
.bbtn.on{background:rgba(0,180,216,.15);color:var(--cyan);border:1px solid rgba(0,180,216,.3)}
.bbtn.mic-on{background:rgba(0,180,216,.2);color:var(--cyan);border:1px solid rgba(0,180,216,.3)}
.bbtn.stop{background:rgba(255,71,87,.15);color:var(--err);border:1px solid rgba(255,71,87,.3)}

/* ── PIP BUBBLE ─────────────────────────── */
.pip{
  position:fixed;bottom:20px;right:20px;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 4px 20px var(--glow);
  display:none;align-items:center;justify-content:center;
  cursor:pointer;z-index:9999;font-size:22px;color:#fff;
  transition:transform .2s;
}
.pip:active{transform:scale(.9)}
.pip.show{display:flex}
.pip.listening{animation:orbListen 1.5s ease-in-out infinite;background:linear-gradient(135deg,#00b4d8,#0077b6)}

/* ── SETTINGS PANEL ─────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.open{opacity:1;pointer-events:auto}
.panel{
  position:fixed;bottom:0;left:0;right:0;max-height:70vh;
  background:var(--bg2);border-top-left-radius:20px;
  border-top-right-radius:20px;padding:20px;
  z-index:101;transform:translateY(100%);transition:transform .3s ease-out;
  overflow-y:auto;
}
.panel.open{transform:translateY(0)}
.panel-h{width:36px;height:4px;background:var(--text3);border-radius:2px;margin:0 auto 16px}
.panel-t{font-size:18px;font-weight:700;margin-bottom:16px}
.sg{margin-bottom:16px}
.sl{font-size:13px;color:var(--text2);margin-bottom:6px}
.si{
  width:100%;padding:10px 14px;background:var(--bg3);
  border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:14px;font-family:'SF Mono',monospace;outline:none;
}
.si:focus{border-color:var(--accent)}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px}
.sv{font-size:20px;font-weight:700;color:var(--accent)}
.st{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* ── SETUP SCREEN ────────────────────────── */
.setup{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;height:100%;
}
.setup-logo{
  width:80px;height:80px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:32px;color:#fff;
  box-shadow:0 0 40px var(--glow);margin-bottom:24px;
}
.setup h2{font-size:24px;font-weight:700;margin-bottom:8px}
.setup p{color:var(--text2);font-size:14px;max-width:300px;margin-bottom:24px}
.setup-input{
  width:100%;max-width:340px;padding:14px 18px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-size:16px;
  font-family:'SF Mono',monospace;outline:none;margin-bottom:12px;
}
.setup-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.setup-btn{
  padding:14px 32px;background:var(--accent);color:#fff;
  border:none;border-radius:var(--r);font-size:16px;
  font-weight:600;cursor:pointer;transition:.15s;
  box-shadow:0 0 20px var(--glow);
}
.setup-btn:active{transform:scale(.96)}
.setup-link{color:var(--accent);font-size:13px;margin-top:12px}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-l">
      <div class="logo">J</div>
      <div>
        <div class="hdr-t">JARVIS</div>
        <div class="hdr-s" id="sub">Mistral Small &middot; api.mistral.ai</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="dot" id="dot"></div>
      <button class="ib" onclick="togglePanel()" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <!-- Main Voice Area -->
  <main class="voice-main" id="voiceMain" style="display:none">
    <div class="orb-container">
      <div class="orb" id="orb" onclick="toggleMic()">
        <span class="orb-icon" id="orbIcon">&#127908;</span>
      </div>
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
    </div>
    <div class="status" id="status">Toca el orbe para hablar</div>
    <div class="transcript" id="transcript"></div>
    <div class="response" id="response"></div>
  </main>

  <!-- API Key Setup -->
  <main class="voice-main" id="setupScreen">
    <div class="setup">
      <div class="setup-logo">J</div>
      <h2>JARVIS</h2>
      <p>Asistente de voz aut&oacute;nomo. Ingresa tu API key de Mistral para comenzar.</p>
      <input type="password" class="setup-input" id="setupKey"
        placeholder="tu-api-key-mistral" onkeydown="if(event.key==='Enter')submitKey()">
      <button class="setup-btn" onclick="submitKey()">Activar</button>
      <a class="setup-link" href="https://console.mistral.ai/" target="_blank">Obtener API key</a>
    </div>
  </main>

  <!-- Bottom Bar -->
  <div class="bottom-bar" id="bottomBar" style="display:none">
    <button class="bbtn" id="micBtn" onclick="toggleMic()">&#127908; Mic</button>
    <button class="bbtn" id="stopBtn" onclick="stopSpeaking()" style="display:none">&#9632; Detener</button>
    <button class="bbtn" id="clearBtn" onclick="clearResponse()">&#128465; Limpiar</button>
  </div>
</div>

<!-- PiP Bubble -->
<div class="pip" id="pip" onclick="window.focus()">&#127908;</div>

<!-- Settings Panel -->
<div class="overlay" id="ov" onclick="togglePanel()"></div>
<div class="panel" id="pnl">
  <div class="panel-h"></div>
  <div class="panel-t">Configuraci&oacute;n</div>
  <div class="sg">
    <div class="sl">API Key</div>
    <input type="password" class="si" id="akI" placeholder="tu-api-key-mistral" onchange="saveKey(this.value)">
  </div>
  <div class="sg">
    <div class="sl">URL del Servidor</div>
    <input type="text" class="si" id="srvI" value="http://localhost:8080" onchange="S.url=this.value;localStorage.setItem('j_srv',this.value)">
  </div>
  <div class="sg">
    <div class="sl">Voz</div>
    <select class="si" id="voiceSelect" onchange="S.voice=this.value;localStorage.setItem('j_voice',this.value)"></select>
  </div>
  <div class="sg">
    <div class="sl">Idioma de escucha</div>
    <select class="si" id="langSelect" onchange="S.lang=this.value;localStorage.setItem('j_lang',this.value);resetRecognition()">
      <option value="es-ES">Espa&ntilde;ol</option>
      <option value="en-US">English</option>
      <option value="fr-FR">Fran&ccedil;ais</option>
      <option value="pt-BR">Portugu&ecirc;s</option>
    </select>
  </div>
  <div class="sg2">
    <div class="sc"><div class="sv" id="sState">&mdash;</div><div class="st">Estado</div></div>
    <div class="sc"><div class="sv" id="sFacts">0</div><div class="st">Facts</div></div>
    <div class="sc"><div class="sv" id="sMsgs">0</div><div class="st">Mensajes</div></div>
    <div class="sc"><div class="sv" id="sReqs">0</div><div class="st">API Calls</div></div>
  </div>
</div>

<script>
// ─── STATE ──────────────────────────────────
const S = {
  msgs: [], loading: false,
  url: localStorage.getItem('j_srv') || 'http://localhost:8080',
  key: localStorage.getItem('j_key') || '',
  voice: localStorage.getItem('j_voice') || '',
  lang: localStorage.getItem('j_lang') || 'es-ES',
  autoSpeak: true,
  listening: false, speaking: false,
  recognition: null, synth: window.speechSynthesis,
};

const dot = document.getElementById('dot');
const orb = document.getElementById('orb');
const orbIcon = document.getElementById('orbIcon');
const statusEl = document.getElementById('status');
const transcript = document.getElementById('transcript');
const responseEl = document.getElementById('response');
const pip = document.getElementById('pip');
const setupScreen = document.getElementById('setupScreen');
const voiceMain = document.getElementById('voiceMain');
const bottomBar = document.getElementById('bottomBar');
const micBtn = document.getElementById('micBtn');
const stopBtn = document.getElementById('stopBtn');

// ─── INIT ───────────────────────────────────
document.getElementById('srvI').value = S.url;
document.getElementById('langSelect').value = S.lang;
if (S.key) document.getElementById('akI').value = '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022';

// Voices
function loadVoices() {
  const sel = document.getElementById('voiceSelect');
  const voices = S.synth.getVoices();
  sel.innerHTML = '<option value="">Default</option>';
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(opt);
  });
  if (S.voice) sel.value = S.voice;
}
loadVoices();
S.synth.onvoiceschanged = loadVoices;

// Check server on load
checkServer();

async function checkServer() {
  try {
    const res = await fetch(`${S.url}/api/status`);
    const data = await res.json();
    if (data.state === 'needs_api_key') {
      showSetup();
    } else {
      showVoice();
    }
  } catch {
    if (!S.key) showSetup();
    else showVoice();
  }
}

function showSetup() {
  setupScreen.style.display = 'flex';
  voiceMain.style.display = 'none';
  bottomBar.style.display = 'none';
}

function showVoice() {
  setupScreen.style.display = 'none';
  voiceMain.style.display = 'flex';
  bottomBar.style.display = 'flex';
}

// ─── API KEY SETUP ──────────────────────────
async function submitKey() {
  const key = document.getElementById('setupKey').value.trim();
  if (!key || key.length < 10) return;

  const btn = document.querySelector('.setup-btn');
  btn.textContent = 'Validando...';
  btn.disabled = true;

  try {
    const res = await fetch(`${S.url}/api/apikey`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apikey: key })
    });
    const data = await res.json();
    if (data.success) {
      S.key = key;
      localStorage.setItem('j_key', key);
      document.getElementById('akI').value = '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022';
      showVoice();
      speak('JARVIS en l\u00ednea. \u00bfEn qu\u00e9 puedo ayudarte?');
    } else {
      alert('Key inv\u00e1lida: ' + (data.error || 'Error desconocido'));
      btn.textContent = 'Activar';
      btn.disabled = false;
    }
  } catch (e) {
    S.key = key;
    localStorage.setItem('j_key', key);
    showVoice();
  }
}

// ─── SPEECH RECOGNITION ─────────────────────
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    statusEl.textContent = 'Voz no soportada en este navegador';
    statusEl.classList.add('thinking-text');
    return null;
  }

  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = S.lang;
  rec.maxAlternatives = 1;

  let finalText = '';

  rec.onstart = () => {
    S.listening = true;
    orb.classList.add('listening');
    orb.classList.remove('speaking', 'thinking');
    dot.className = 'dot listen';
    orbIcon.innerHTML = '&#128308;';
    statusEl.textContent = 'Escuchando...';
    statusEl.className = 'status active';
    transcript.textContent = '';
    responseEl.textContent = '';
    pip.classList.add('listening');
    micBtn.classList.add('mic-on');
    stopSpeaking();
  };

  rec.onresult = (e) => {
    let interim = '';
    finalText = '';

    for (let i = 0; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalText += t;
      } else {
        interim += t;
      }
    }

    if (finalText) {
      transcript.textContent = finalText;
      transcript.className = 'transcript';
    } else if (interim) {
      transcript.textContent = interim;
      transcript.className = 'transcript interim';
    }
  };

  rec.onerror = (e) => {
    if (e.error === 'not-allowed') {
      statusEl.textContent = 'Acceso al micr\u00f3fono denegado';
      statusEl.className = 'status thinking-text';
    } else if (e.error === 'no-speech') {
      statusEl.textContent = 'No se detect\u00f3 voz. Toca para intentar de nuevo';
      statusEl.className = 'status';
    } else if (e.error !== 'aborted') {
      console.log('Speech error:', e.error);
    }
  };

  rec.onend = () => {
    S.listening = false;
    orb.classList.remove('listening');
    dot.className = 'dot';
    orbIcon.innerHTML = '&#127908;';
    pip.classList.remove('listening');
    micBtn.classList.remove('mic-on');

    // If we got text, send it
    if (finalText.trim()) {
      sendVoice(finalText.trim());
    } else {
      statusEl.textContent = 'Toca el orbe para hablar';
      statusEl.className = 'status';
    }
  };

  return rec;
}

function resetRecognition() {
  if (S.recognition) {
    S.listening = false;
    try { S.recognition.stop(); } catch {}
    S.recognition = null;
  }
}

function toggleMic() {
  if (!S.recognition) {
    S.recognition = initRecognition();
  }
  if (!S.recognition) return;

  if (S.listening) {
    S.listening = false;
    S.recognition.stop();
  } else {
    // Stop speaking if speaking
    stopSpeaking();
    try { S.recognition.start(); } catch (e) {
      S.recognition.stop();
      setTimeout(() => { try { S.recognition.start(); } catch {} }, 200);
    }
  }
}

// ─── TEXT TO SPEECH ─────────────────────────
function speak(text) {
  if (!S.synth) return;
  S.synth.cancel();

  const clean = text
    .replace(/```[\s\S]*?```/g, ' bloque de c\u00f3digo ')
    .replace(/`[^`]+`/g, ' c\u00f3digo ')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/#{1,6}\s/g, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[•\-]\s/g, '')
    .slice(0, 600);

  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = 1.05;
  utter.pitch = 0.95;

  const voices = S.synth.getVoices();
  if (S.voice && voices[S.voice]) {
    utter.voice = voices[S.voice];
  } else {
    const preferred = voices.find(v => v.name.includes('Google') && v.lang.startsWith(S.lang.slice(0,2)))
      || voices.find(v => v.name.includes('Google') && v.lang.startsWith('es'))
      || voices.find(v => v.lang.startsWith(S.lang.slice(0,2)))
      || voices[0];
    if (preferred) utter.voice = preferred;
  }

  utter.onstart = () => {
    S.speaking = true;
    orb.classList.add('speaking');
    dot.className = 'dot speak';
    statusEl.textContent = 'Hablando...';
    statusEl.className = 'status speaking-text';
    stopBtn.style.display = 'flex';
  };
  utter.onend = () => {
    S.speaking = false;
    orb.classList.remove('speaking');
    dot.className = 'dot';
    statusEl.textContent = 'Toca el orbe para hablar';
    statusEl.className = 'status';
    stopBtn.style.display = 'none';
  };
  utter.onerror = () => {
    S.speaking = false;
    orb.classList.remove('speaking');
    dot.className = 'dot';
    stopBtn.style.display = 'none';
  };

  S.synth.speak(utter);
}

function stopSpeaking() {
  S.synth.cancel();
  S.speaking = false;
  orb.classList.remove('speaking');
  dot.className = 'dot';
  stopBtn.style.display = 'none';
  if (!S.listening) {
    statusEl.textContent = 'Toca el orbe para hablar';
    statusEl.className = 'status';
  }
}

// ─── SEND VOICE MESSAGE ────────────────────
async function sendVoice(text) {
  if (S.loading) return;

  S.loading = true;
  transcript.textContent = text;
  transcript.className = 'transcript';
  responseEl.textContent = '';

  // Show thinking state
  orb.classList.add('thinking');
  dot.className = 'dot think';
  statusEl.textContent = 'Procesando...';
  statusEl.className = 'status thinking-text';
  micBtn.disabled = true;

  try {
    const res = await fetch(`${S.url}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    if (!res.ok) throw new Error(`Server error: ${res.status}`);

    const data = await res.text();
    responseEl.innerHTML = fmt(data);
    document.getElementById('sMsgs').textContent = ++S.msgs.length;

    // Speak the response
    speak(data);

  } catch (e) {
    responseEl.textContent = `Error: ${e.message}`;
    orb.classList.remove('thinking');
    dot.className = 'dot err';
    statusEl.textContent = 'Error de conexi\u00f3n';
    statusEl.className = 'status thinking-text';
  } finally {
    S.loading = false;
    orb.classList.remove('thinking');
    micBtn.disabled = false;
    if (!S.speaking) {
      statusEl.textContent = 'Toca el orbe para hablar';
      statusEl.className = 'status';
      dot.className = 'dot';
    }
  }
}

// ─── FORMAT ─────────────────────────────────
function fmt(t) {
  let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,_2,code)=>`<pre><code>${code.trim()}</code></pre>`);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\n/g,'<br>');
  return h;
}

function clearResponse() {
  transcript.textContent = '';
  responseEl.textContent = '';
  statusEl.textContent = 'Toca el orbe para hablar';
  statusEl.className = 'status';
}

// ─── PiP / BACKGROUND PERSISTENCE ───────────
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pip.classList.add('show');
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'KEEP_ALIVE' });
    }
  } else {
    pip.classList.remove('show');
  }
});

// Wake lock
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      const lock = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
          try { await navigator.wakeLock.request('screen'); } catch {}
        }
      });
    }
  } catch {}
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ─── UTILITIES ──────────────────────────────
function togglePanel() {
  const o = document.getElementById('ov'), p = document.getElementById('pnl');
  const open = o.classList.contains('open');
  if (open) { o.classList.remove('open'); p.classList.remove('open'); }
  else { o.classList.add('open'); p.classList.add('open'); fetchStats(); }
}

async function fetchStats() {
  try {
    const r = await fetch(`${S.url}/api/status`);
    const d = await r.json();
    document.getElementById('sState').textContent = d.state || '\u2014';
    document.getElementById('sFacts').textContent = d.memory?.totalFacts || 0;
    document.getElementById('sReqs').textContent = d.apiRequests || 0;
  } catch { document.getElementById('sState').textContent = 'offline'; }
}

async function saveKey(key) {
  if (!key || key.length < 10) return;
  try {
    const r = await fetch(`${S.url}/api/apikey`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apikey: key })
    });
    const d = await r.json();
    if (d.success) { S.key = key; localStorage.setItem('j_key', key); }
  } catch { S.key = key; localStorage.setItem('j_key', key); }
}

// ─── BOOT ───────────────────────────────────
requestWakeLock();
</script>
